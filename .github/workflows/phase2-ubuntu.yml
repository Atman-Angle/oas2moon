name: phase2-ubuntu

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  model-codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Install MoonBit CLI
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain
        run: |
          moon --version
          python --version
          pytest --version

      - name: Update MoonBit registry for frontend adapter
        working-directory: src/frontend_adapter
        run: moon update
      - name: Check formal MoonBit adapter
        working-directory: src/frontend_adapter
        run: |
          moon fmt --check
          moon check --target native --deny-warn

      - name: Update MoonBit registry for core authority
        working-directory: src/core_moonbit
        run: moon update
      - name: Check MoonBit core authority
        working-directory: src/core_moonbit
        run: |
          moon fmt --check
          moon check --target native --deny-warn
          moon test --target native --deny-warn

      - name: Update MoonBit registry for codegen emitter
        working-directory: src/codegen_moonbit
        run: moon update
      - name: Check codegen emitter
        working-directory: src/codegen_moonbit
        run: |
          moon fmt --check
          moon check --target native --deny-warn

      - name: Determinism gate (T13)
        run: python -m pytest tests/test_t13_determinism.py -q

      - name: Run all tests (Phase 1, 1.5, 2)
        run: pytest -q tests
