name: cross-platform-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Ubuntu
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Install MoonBit CLI (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        env:
          MOONBIT_INSTALL_VERSION: 1.0.0-rc1+3c0520448
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MOONBIT_INSTALL_VERSION: 1.0.0-rc1+3c0520448
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Put the MSVC toolchain on PATH
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify toolchain (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          moon --version
          moonc -v
          if ! moonc -v | grep -q '^v1\.0\.0-rc1+3c0520448'; then exit 1; fi
          python --version
          pytest --version
          cc --version

      - name: Verify toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          moon --version
          moonc -v
          if ((moonc -v) -notmatch '^v1\.0\.0-rc1\+3c0520448') { exit 1 }
          python --version
          pytest --version
          where.exe cl

      - name: Check frontend adapter (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: src/frontend_adapter
        run: |
          moon update
          moon fmt --check
          moon check --target native
          moon build --target native

      - name: Check frontend adapter (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: src/frontend_adapter
        run: |
          moon update
          moon fmt --check
          moon check --target native
          moon build --target native

      - name: Check core authority (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: src/core_moonbit
        run: |
          moon update
          moon fmt --check
          moon check --target native
          moon build --target native
          moon test --target native

      - name: Check core authority (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: src/core_moonbit
        run: |
          moon update
          moon fmt --check
          moon check --target native
          moon build --target native
          moon test --target native

      - name: Check runtime package (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: src/runtime_moonbit
        run: |
          moon update
          moon fmt --check
          moon check --target native --deny-warn
          moon test --target native --deny-warn

      - name: Check runtime package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: src/runtime_moonbit
        run: |
          moon update
          moon fmt --check
          moon check --target native --deny-warn
          moon test --target native --deny-warn

      - name: Check codegen emitter (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: src/codegen_moonbit
        run: |
          moon update
          moon fmt --check
          moon check --target native
          moon build --target native

      - name: Check codegen emitter (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: src/codegen_moonbit
        run: |
          moon update
          moon fmt --check
          moon check --target native
          moon build --target native

      - name: Deterministic regeneration gate
        run: python -m pytest tests/test_t13_determinism.py -q

      - name: Run generator and fixture tests
        run: python -m pytest tests -q

      - name: Verify Unicode checkout paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $unicodeRoot = Join-Path $env:RUNNER_TEMP '验收路径\oas2moon'
          git clone --local $env:GITHUB_WORKSPACE $unicodeRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $unicodeRoot
          try {
            python -m pytest tests/test_t10_cli.py -q
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Compile bounded real-world corpus
        run: >-
          python tools/corpus_metrics.py
          --json-out tests/_build/corpus-metrics/summary.json
          --report-out tests/_build/corpus-metrics/report.md

      - name: Validate corpus summary
        run: >-
          python -c "import json, pathlib, sys; p=json.loads(pathlib.Path('tests/_build/corpus-metrics/summary.json').read_text(encoding='utf-8')); s=p['summary']['real_world']; total=s['specs_total']; compiled=str(s['specs_generated']) + '/' + str(s['specs_generated']); valid=total > 0 and s['specs_generated'] + s['specs_rejected'] == total and s['specs_error'] == 0 and s['operations_dropped'] == 0 and s['compile_pass'] == compiled; sys.exit(0 if valid else 'Real-world corpus regression: ' + str(s))"

      - name: Run Petstore HTTP integration demo
        shell: pwsh
        run: pwsh -NoProfile -File demo/petstore/run_demo.ps1

      - name: Upload demo logs and wire capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petstore-demo-evidence-${{ matrix.platform }}
          path: |
            demo/petstore/_out/logs
            demo/petstore/_out/server_capture.json
            demo/petstore/_out/canonical.json
          if-no-files-found: warn
